# Mantém o sistema ativo no plano grátis: o Supabase pausa o banco depois de ~7 dias sem uso.
# Todo dia acorda o Render e faz uma consulta no banco pela rota /api/saude.
# Endereço: variável do repositório APP_URL (Settings → Secrets and variables → Actions → Variables);
# sem ela, usa https://lubian-gestao.onrender.com.
name: Manter ativo

on:
  schedule:
    - cron: '17 11 * * *' # todo dia, 08:17 em Brasília
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Consultar o banco pelo sistema
        env:
          APP_URL: ${{ vars.APP_URL || 'https://lubian-gestao.onrender.com' }}
        run: |
          # O Render grátis leva até ~1 min para acordar: tenta algumas vezes.
          for tentativa in 1 2 3 4 5; do
            if curl -fsS --max-time 120 "$APP_URL/api/saude"; then
              echo; echo "Sistema e banco ativos."; exit 0
            fi
            echo "Tentativa $tentativa falhou; esperando 30s..."; sleep 30
          done
          echo "::error::O sistema não respondeu. Confira se o projeto do Supabase está pausado (Restore project) e os logs do Render."
          exit 1

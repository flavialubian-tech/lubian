# Render (plano Free): New → Blueprint → escolher este repositório. Os valores marcados sync:false
# são pedidos na tela (copiar do bloco de notas com as chaves do Supabase).
services:
  - type: web
    name: lubian-gestao
    runtime: docker
    plan: free
    region: virginia
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SENHA_INICIAL
        sync: false
      - key: SUPABASE_BUCKET
        value: lubian
      # 512 MB não comportam o Chromium: o PDF é feito pelo navegador de quem abre (src/pdf/modo.ts).
      - key: PDF_PELO_NAVEGADOR
        value: "1"
